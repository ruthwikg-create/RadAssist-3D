name: RadAssist 3D CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pydicom==3.0.2" "highdicom==0.28.1" "requests>=2.32,<3.0" pytest
      - run: python -m compileall -q backend
      - run: python -c "import backend.dicom_services, backend.dicomweb_client, backend.ai_assistant; print('backend runtime imports: OK')"
      - run: python -m pytest -q backend/tests
