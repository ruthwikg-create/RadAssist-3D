name: RadAssist feature validation

on:
  push:
    branches: ["main"]

jobs:
  validate-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pro-radiology-workstation
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend
      - run: python -c "import backend.main, backend.dicom_services, backend.dicomweb_client, backend.ai_assistant; print('backend runtime imports: OK')"
      - run: python -m pytest -q backend/tests
